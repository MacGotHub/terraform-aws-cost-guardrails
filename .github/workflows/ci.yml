name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.11.5"

      - name: fmt check
        run: tofu fmt -check -recursive .

      - name: validate every module and example
        run: |
          set -euo pipefail
          for dir in modules/*/ examples/*/; do
            echo "== $dir =="
            (cd "$dir" && tofu init -backend=false -input=false && tofu validate)
          done
